# ============================================================
#  Single source of truth for the appeal page, the README,
#  and every outreach message.
#  Edit this file, then run:  python3 build.py
# ============================================================

[identity]
handle        = "pdev-labs"
profile       = "https://github.com/pdev-labs"
display_name  = "pdev-labs"
# ---- FILL THIS IN -------------------------------------------------
# Leave as-is and build.py will refuse to generate a public page
# with a placeholder address in it.
email         = "pdev.labs@gmail.com"
# Optional. Leave "" to omit the line entirely.
location      = ""
# -------------------------------------------------------------------

[hardware]
dead_machine  = "Dell Latitude E5440"
dead_year     = 2014
dead_note     = "4th-gen Core i5, DDR3, spinning disk. Motherboard is gone. Nothing recoverable."

# What would actually unblock the work. Keep it modest and true.
[hardware.wanted]
minimum = [
  "x86-64, 4 cores or better",
  "16 GB RAM (8 GB is workable, 16 GB removes the ceiling)",
  "NVMe SSD, 256 GB or larger",
  "Runs Linux with no out-of-tree driver fights",
]
nice_to_have = [
  "32 GB RAM (local Android emulator + Rust release builds at the same time)",
  "USB-C with DisplayPort alt mode",
  "User-replaceable battery and SSD",
]
not_asking = "Not asking for the newest or the fastest. Refurbished, previous-generation, or review-unit hardware all do the job."

[context]
# Honest framing. This is not a sob story and the page does not pretend it is.
situation  = "My only machine died in November 2026. I ship everything from a phone, and that ceiling is now the bottleneck on four active repos."
what_i_do  = "I am 16. Solo maintainer: I write Linux-on-Android tooling, Rust clients, ESP32 firmware and Python packaging. Everything is public, and every release is built by CI I wrote."
workaround = "Nothing above was built on a laptop. The desktop comes from [Linux-For-Android](https://github.com/pdev-labs/Linux-For-Android), a full Linux environment running on Android with no root. When something needs a real GUI session, it runs inside a GitHub Actions runner provisioned by [Free-Github-Actions-RDP](https://github.com/pdev-labs/Free-Github-Actions-RDP-for-App-Testing). Both are my own projects, so the workaround is part of the portfolio rather than an excuse."

# What the donor gets. Rendered as section 04 of the page.
[[offers]]
title = "Named credit in the repositories"
text  = "Whoever provides the machine is credited by name in the README of every repository it unblocks, and at the top of the build log. Not a temporary banner that quietly disappears — it stays there."

[[offers]]
title = "A public build log"
text  = "What shipped each week, what broke, and how long each build took — on the actual hardware."

[[offers]]
title = "A written Linux compatibility report"
text  = "What worked out of the box, what needed a quirk, and what I would tell the next person who buys it. Published in full, with attribution, and nobody gets to edit it first."

[[offers]]
title = "Upstream fixes"
text  = "Every driver quirk, packaging bug and kernel problem I hit turns into a patch or a bug report rather than a tweet."

[[offers]]
title = "It stays in circulation"
text  = "If the machine is replaced later, it goes to another maintainer, not into a drawer."

[outreach]
from_name   = "pdev-labs"
from_email  = "pdev.labs@gmail.com"   # normally identical to identity.email
reply_to    = "pdev.labs@gmail.com"
daily_cap   = 5                 # hard ceiling, enforced by send.py
min_gap_min = 20                # minutes between two sends, enforced
smtp_host   = "smtp.gmail.com"
smtp_port   = 587
